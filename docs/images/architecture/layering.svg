<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1099" height="599" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="200" y="30" width="640" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
