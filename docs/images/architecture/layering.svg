<text x="214" y="264" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">renderer/: BaseRenderer and the five layers, their LUTs and tuning headers</text>
<rect x="200" y="302" width="640" height="50" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
