<text x="214" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">core/config.h: Config, one plain sub-struct per layer, each with operator==</text>
<rect x="200" y="438" width="640" height="50" rx="8" fill="#eaeef2" stroke="#6e7781" stroke-width="1.5"/>
