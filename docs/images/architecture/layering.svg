<text x="214" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">core/: ResourceContext, BufferRegistry, ReadList | gl/: ShaderCache</text>
<rect x="200" y="370" width="640" height="50" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
