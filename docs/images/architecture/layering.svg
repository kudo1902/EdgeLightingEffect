<text x="214" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">lib/capi/: libedge-lighting-c, flat el_* calls (C++ hosts skip it)</text>
<rect x="200" y="166" width="640" height="50" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="184" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="end">Orchestrator</text>
<text x="214" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">core/edge-lighting.h: EdgeLightingEffect | animation/: Modulator, Animation</text>
<rect x="200" y="234" width="640" height="50" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
