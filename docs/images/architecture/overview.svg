<svg xmlns="http://www.w3.org/2000/svg" width="900" height="672" viewBox="0 0 900 672" role="img" aria-label="The system at a glance">
<title>The system at a glance</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="671" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="60" y="30" width="300" height="66" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="72" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">C++ host</text>
<text x="72" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">demo/, an app, the tools</text>
<rect x="540" y="30" width="300" height="66" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="552" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">C, C#, Python ... host</text>
<text x="552" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">demo-capi/, FFI, P-Invoke</text>
<rect x="540" y="128" width="300" height="66" rx="8" fill="#eaeef2" stroke="#6e7781" stroke-width="1.5"/>
<text x="552" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">C ABI | lib/capi/</text>
<text x="552" y="170" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">libedge-lighting-c: el_* calls,</text>
<text x="552" y="188" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">a staging Config per handle</text>
<path d="M 690 96 L 690 128" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="230" width="780" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="72" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">EdgeLightingEffect | core/edge-lighting.h</text>
<text x="72" y="272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">Config base + active | Clock | AnimationManager | PrepareSchedule</text>
<text x="72" y="290" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">SetConfig, Attach, Update(dt), Render(w, h)</text>
<path d="M 210 96 L 210 230" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="218.0" y="163.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">SetConfig, Update, Render</text>
<path d="M 690 194 L 690 230" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="360" width="330" height="190" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="72" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Renderers (compositing order)</text>
<text x="72" y="402" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">NeonRenderer</text>
<text x="72" y="420" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">DropletsRenderer</text>
<text x="72" y="438" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">LensFlareRenderer</text>
<text x="72" y="456" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">SpotlightRenderer</text>
<text x="72" y="474" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">DebugRenderer</text>
<text x="72" y="492" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">a host's own (RendererLayer::CUSTOM)</text>
<text x="72" y="510" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">each one visual layer; none calls another</text>
<rect x="510" y="360" width="330" height="190" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
<text x="522" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">ResourceContext (one per effect)</text>
<text x="522" y="402" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">ShaderCache</text>
<text x="522" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">   compiled stages, shared</text>
<text x="522" y="438" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">BufferRegistry</text>
<text x="522" y="456" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">   records of every offscreen buffer</text>
<text x="522" y="474" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">ReadList</text>
<text x="522" y="492" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">   who reads which buffer this frame</text>
<text x="522" y="510" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">fullscreen quad</text>
<path d="M 225 310 L 225 360" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="233.0" y="339.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">owns, calls in order</text>
<path d="M 675 310 L 675 360" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="683.0" y="339.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">creates, shares</text>
<path d="M 390 455 L 510 455" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="450.0" y="393.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">BuildProgram</text>
<text x="450.0" y="409.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">RegisterBuffer</text>
<text x="450.0" y="425.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">MarkBufferCurrent</text>
<text x="450.0" y="441.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">Find</text>
<rect x="60" y="590" width="780" height="52" rx="8" fill="#eaeef2" stroke="#6e7781" stroke-width="1.5"/>
<text x="450.0" y="620.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">gl/ RAII wrappers | util/ | ShaderSource::* (shaders embedded at configure time)</text>
<path d="M 225 550 L 225 590" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 675 550 L 675 590" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
