<text x="820.0" y="452" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">in the ShaderCache</text>
<path d="M 260 70 L 360 70" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="316.0" y="64.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">owns</text>
<path d="M 480 100 L 480 210" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
