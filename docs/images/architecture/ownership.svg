<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Who owns what">
<title>Who owns what</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
</defs>
<rect x="0.5" y="0.5" width="979" height="559" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="40" y="40" width="220" height="60" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="150.0" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">Host</text>
<text x="150.0" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">or an el_effect handle</text>
<rect x="360" y="40" width="240" height="60" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="480.0" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">EdgeLightingEffect</text>
<text x="480.0" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">Config, Clock, animations</text>
<rect x="360" y="210" width="240" height="60" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="480.0" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">a renderer</text>
<text x="480.0" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">BaseRenderer subclass</text>
<rect x="360" y="400" width="240" height="76" rx="8" fill="#eaeef2" stroke="#6e7781" stroke-width="1.5"/>
<text x="480.0" y="422" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">its GL objects</text>
<text x="480.0" y="442" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">programs, Framebuffers,</text>
<text x="480.0" y="460" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">LUTs, VAOs, UBOs (RAII)</text>
