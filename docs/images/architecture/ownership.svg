<path d="M 150 100 L 150 240 L 360 240" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="158.0" y="205.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">may keep a</text>
<text x="158.0" y="221.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">shared_ptr</text>
<path d="M 600 70 L 820 70 L 820 180" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="725.0" y="62.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">shared_ptr</text>
<path d="M 600 232 L 690 232" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="611.0" y="224.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">shared_ptr</text>
<path d="M 480 270 L 480 400" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="472.0" y="339.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="end">owns (RAII members)</text>
<path d="M 600 255 L 650 255 L 650 300 L 710 300" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="644.0" y="294.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="end">registers</text>
<path d="M 710 318 L 600 420" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="643.0" y="363.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="end">refers to its</text>
<text x="643.0" y="379.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="end">Framebuffer</text>
<path d="M 600 450 L 710 440" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="655.0" y="435.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">links</text>
<rect x="40" y="440" width="280" height="96" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<path d="M 54 464 L 104 464" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="114" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">owns / strong reference</text>
<path d="M 54 490 L 104 490" stroke="#57606a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="114" y="494" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">refers, does not own</text>
<text x="54" y="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">a linked program keeps its stages alive in GL</text>
</svg>
