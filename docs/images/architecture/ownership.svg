<text x="820.0" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">in the registry's slots</text>
<rect x="710" y="410" width="220" height="60" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
