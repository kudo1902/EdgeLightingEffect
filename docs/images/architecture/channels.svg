<rect x="0.5" y="0.5" width="1059" height="599" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="40" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">1. The caller's framebuffer</text>
