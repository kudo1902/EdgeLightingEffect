<text x="178" y="466" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">Phase 1 (Prepare -&gt; RenderOffscreen) marks each buffer current in the registry.</text>
<text x="178" y="484" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">Phase 2 (Render -&gt; RenderOnscreen) draws the caller's target in ONE run: on a tiler, one store per frame.</text>
