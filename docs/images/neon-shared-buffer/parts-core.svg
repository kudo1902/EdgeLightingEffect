<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" role="img" aria-label="The neon's light as two parts, read by any reader in its own pass">
<title>The neon's light as two parts, read by any reader in its own pass</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1239" height="659" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="30" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">Planned - the two parts are the product; a flat texture is a reader's own pass</text>
<rect x="30" y="52" width="610" height="286" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="48" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 1 - Prepare: offscreen, into the neon's own textures</text>
<rect x="50" y="104" width="300" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="62" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Pass 0 / 0b / 1a</text>
<text x="62" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">tables and gather</text>
<rect x="380" y="116.0" width="240" height="32" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="390" y="137.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">Emission, Gather</text>
<text x="610" y="137.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#57606a" text-anchor="end">DEBUG</text>
<path d="M 350 132.0 L 380 132.0" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50" y="174" width="300" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="62" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Pass 1b / 1c - the glow</text>
<text x="62" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">halo + bloom at resolutionScale</text>
<rect x="380" y="186.0" width="240" height="32" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="390" y="207.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="start">Glow</text>
<text x="610" y="207.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1a7f37" text-anchor="end">PUBLIC</text>
<path d="M 350 202.0 L 380 202.0" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50" y="244" width="300" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="62" y="266" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Pass 1t - the ring atlas</text>
<text x="62" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">on a still frame's first, or while</text>
<text x="62" y="304" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">the Ring is read</text>
<rect x="380" y="266.0" width="240" height="32" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="390" y="287.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="start">Ring</text>
<text x="610" y="287.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1a7f37" text-anchor="end">PUBLIC</text>
<path d="M 350 282.0 L 380 282.0" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50" y="354" width="570" height="92" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="62" y="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">the neon's light: Glow + Ring, described (NeonLight)</text>
<text x="62" y="396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">the two textures, the glow's box, the ring's boxes and packing, the</text>
<text x="62" y="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">edge mask, the viewport and a version - found through the effect or</text>
<text x="62" y="432" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">the context, not a pointer to the neon</text>
<path d="M 500 298.0 L 500 354" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 440 218.0 L 440 266.0" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="670" y="52" width="290" height="334" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="688" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 2 - Render: the screen</text>
<rect x="690" y="96" width="250" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="702" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Pass 2a - fill</text>
<text x="702" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">unchanged</text>
<rect x="690" y="162" width="250" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="702" y="184" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Pass 2b - blit</text>
<text x="702" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">Glow scaled up, edge mask</text>
<path d="M 815.0 152 L 815.0 162" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="690" y="228" width="250" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="702" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Pass 2c - edge ring</text>
<text x="702" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">copy of Ring, or shaded</text>
<path d="M 815.0 218 L 815.0 228" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="690" y="308" width="250" height="56" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="815.0" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">the caller's framebuffer</text>
<text x="815.0" y="350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">what you see; dithered</text>
<path d="M 815.0 284 L 815.0 308" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 620 202.0 L 655 202.0 L 655 190 L 690 190" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 620 276.0 L 668 276.0 L 668 256 L 690 256" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="990" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Readers (their own passes)</text>
<rect x="990" y="96" width="230" height="110" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="1002" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">a host shader</text>
<text x="1002" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">NEON_LIGHT_GLSL:</text>
<text x="1002" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">neonLight(p) per pixel</text>
<text x="1002" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">declares a read of Ring</text>
<rect x="990" y="222" width="230" height="110" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="1002" y="244" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">a library layer</text>
<text x="1002" y="264" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">the same chunk; its</text>
<text x="1002" y="282" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">CollectReads orders it</text>
<text x="1002" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">after the neon</text>
<rect x="990" y="348" width="230" height="128" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="1002" y="370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">a flat texture, if</text>
<text x="1002" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">a reader wants one: its</text>
<text x="1002" y="408" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">own pass at its own scale,</text>
<text x="1002" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">neonLightOverSquare()</text>
<text x="1002" y="444" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">(today's pass 1s, moved)</text>
<path d="M 972 150 L 990 150" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 972 276 L 990 276" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 972 410 L 990 410" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 620 400 L 972 400 L 972 150" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="990" y="510" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">no pass in the neon exists</text>
<text x="990" y="526" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">for readers but the ring</text>
<text x="990" y="542" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">atlas on moving frames,</text>
<text x="990" y="558" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">and only while it is read</text>
</svg>
