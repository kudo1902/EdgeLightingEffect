<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-label="One frame's decisions about the ring atlas and the shared buffer">
<title>One frame's decisions about the ring atlas and the shared buffer</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="1099" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="30" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">One frame's decisions - RenderOffscreen, after it knows whether anything moved</text>
<rect x="20" y="52" width="1160" height="868" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="38" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 1 - Prepare</text>
<rect x="40" y="96" width="340" height="74" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="52" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">nothing moved</text>
<text x="52" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">reuseOffscreen: passes 1a and 1b</text>
<text x="52" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">are reused this frame</text>
<rect x="430" y="96" width="340" height="74" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="442" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">the Ring is read</text>
<text x="442" y="138" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">IsBufferWanted(RING_KEY)</text>
<text x="442" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">a layer's read, or AddHostRead</text>
<rect x="820" y="96" width="340" height="74" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="832" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">the Composite is wanted</text>
<text x="832" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">compositeScale &gt; 0, read, and</text>
<text x="832" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">its two programs built</text>
<rect x="300" y="214" width="600" height="76" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="600.0" y="236" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">the ring atlas is needed</text>
<text x="600.0" y="256" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">possible: the glow drawn, a ring on screen, half float, and not a size</text>
<text x="600.0" y="274" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">whose allocation just failed - AND one of the three above</text>
<path d="M 210 170 L 210 192 L 360 192 L 360 214" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 600 170 L 600 192 L 600.0 192 L 600.0 214" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 990 170 L 990 192 L 840 192 L 840 214" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="336" width="230" height="92" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="52" y="358" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">no atlas this frame</text>
<text x="52" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">2c shades the ring on the</text>
<text x="52" y="396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">screen (or composites its</text>
<text x="52" y="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">field), as before</text>
<path d="M 300 252 L 155 252 L 155 336" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="225.85000000000002" y="244.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">no</text>
<rect x="300" y="336" width="600" height="76" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="600.0" y="358" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">reuse it?</text>
<text x="600.0" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">nothing moved, it holds last frame's ring, it is EXACT (not a field scaled</text>
<text x="600.0" y="396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">to a moving intensity), and the viewport and packing are the same</text>
<path d="M 600.0 290 L 600.0 336" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="606.0" y="321.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">yes</text>
<rect x="300" y="458" width="280" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="440.0" y="480" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">reuse the atlas</text>
<text x="440.0" y="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">no pass; its version holds</text>
<rect x="620" y="458" width="280" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="760.0" y="480" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">pass 1t: draw it</text>
<text x="760.0" y="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">shaded, or from the ring's field;</text>
<text x="760.0" y="518" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">sets exact</text>
<path d="M 440 412 L 440 458" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="446.0" y="443.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">yes</text>
<path d="M 760 412 L 760 458" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="766.0" y="443.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">no</text>
<rect x="300" y="580" width="600" height="76" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="600.0" y="602" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">the shared light (SharedLight)</text>
<text x="600.0" y="622" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">valid while the glow and the atlas hold this frame's light - or the glow</text>
<text x="600.0" y="640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">alone, with no ring on screen; what pass 1s and GetSharedLight hand on</text>
<path d="M 440 534 L 440 580" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 760 534 L 760 580" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="702" width="600" height="76" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="600.0" y="724" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">reuse the shared buffer?</text>
<text x="600.0" y="744" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">wanted, nothing moved, the atlas NOT drawn again this frame (it is</text>
<text x="600.0" y="762" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">assembled from it), and the same scale, viewport and region</text>
<path d="M 600.0 656 L 600.0 702" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 990 170 L 990 192 L 1150 192 L 1150 740 L 900 740" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1092.0" y="609.6" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">wanted</text>
<rect x="300" y="824" width="280" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="440.0" y="846" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">reuse it</text>
<text x="440.0" y="866" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">no pass; its version holds</text>
<rect x="620" y="824" width="280" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="760.0" y="846" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">pass 1s: assemble it</text>
<text x="760.0" y="866" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">fill at s, then the light averaged</text>
<text x="760.0" y="884" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">per texel (needs the light valid)</text>
<path d="M 440 778 L 440 824" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="446.0" y="809.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">yes</text>
<path d="M 760 778 L 760 824" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="766.0" y="809.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">no</text>
<text x="40" y="716" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">not wanted:</text>
<text x="40" y="732" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">no pass 1s, and the</text>
<text x="40" y="748" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">Composite record is</text>
<text x="40" y="764" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">not current</text>
<text x="940" y="860" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">then: publishBuffers marks</text>
<text x="940" y="876" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">Ring and Composite current</text>
<text x="940" y="892" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" font-style="italic">when they hold this frame's</text>
<rect x="20" y="940" width="1160" height="140" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="38" y="966" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">Phase 2 - Render: the screen</text>
<rect x="40" y="984" width="240" height="76" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="52" y="1006" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">2a fill, 2b blit</text>
<text x="52" y="1026" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start">the blit reads the Glow</text>
<rect x="300" y="984" width="600" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="600.0" y="1006" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">pass 2c: the edge ring</text>
<text x="600.0" y="1026" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">mFramePlan.ringFromAtlas: COPY the atlas, dithered - else shade the</text>
<text x="600.0" y="1044" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">ring on the screen, or composite its field, as before the atlas</text>
<path d="M 280 1022 L 300 1022" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
