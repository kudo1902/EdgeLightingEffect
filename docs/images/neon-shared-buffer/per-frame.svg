<text x="134" y="158.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="end">Today</text>
<rect x="154" y="118" width="242" height="76" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="275.0" y="151.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">ring SHADED on screen</text>
<text x="275.0" y="169.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">(or from its field)</text>
<rect x="404" y="118" width="242" height="76" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="525.0" y="151.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">glow redrawn</text>
<text x="525.0" y="169.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">ring SHADED on screen</text>
<rect x="654" y="118" width="242" height="76" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="775.0" y="160.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">(no parts to read)</text>
<rect x="904" y="118" width="242" height="76" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="1025.0" y="151.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">+ fill, glow copy and</text>
<text x="1025.0" y="169.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">ring SHADED AGAIN at s</text>
<text x="134" y="242.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="end">Proposed</text>
<rect x="154" y="202" width="242" height="76" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="275.0" y="244.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">ring COPIED from atlas</text>
<rect x="404" y="202" width="242" height="76" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="525.0" y="235.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">glow redrawn</text>
<text x="525.0" y="253.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">ring shaded into atlas, copied</text>
<rect x="654" y="202" width="242" height="76" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="775.0" y="244.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">nothing extra</text>
<rect x="904" y="202" width="242" height="76" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="1025.0" y="235.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">+ one copy pass:</text>
<text x="1025.0" y="253.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="middle">fill + Glow + Ring at s</text>
<rect x="150" y="292" width="22" height="16" rx="3" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="182" y="305" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">costs more than it needs to</text>
<rect x="150" y="316" width="22" height="16" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="182" y="329" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">cheaper than today</text>
</svg>
