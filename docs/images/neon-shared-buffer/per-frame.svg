<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="342" viewBox="0 0 1180 342" role="img" aria-label="What the neon does on each kind of frame">
<title>What the neon does on each kind of frame</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1179" height="341" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="30" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">What the neon does on each kind of frame (the gather, tables and glow work are the same in both)</text>
<rect x="154" y="70" width="242" height="36" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="275.0" y="93" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">still frame</text>
<rect x="404" y="70" width="242" height="36" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="525.0" y="93" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">something moved</text>
<rect x="654" y="70" width="242" height="36" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="775.0" y="93" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">+ a parts reader</text>
<rect x="904" y="70" width="242" height="36" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
